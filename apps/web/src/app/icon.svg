<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Xetral">
  <!--
    The tab icon: the mark ALONE, which is what a favicon is for.

    It is set on a solid navy tile rather than drawn bare. A bare navy mark
    sits on whatever the browser paints behind a tab strip, which is near-navy
    in every dark theme — the icon then disappears exactly where a customer
    hunts for it among twenty tabs. The tile also gives the mark a consistent
    silhouette at 16px, where the gap down its middle is a single pixel.

    The geometry is the supplied trace, scaled by 0.62 and centred; it is the
    same two paths as src/ui/logo.tsx and must change with it.
  -->
  <rect width="512" height="512" rx="114" fill="#0D1B3E"/>
  <g transform="translate(89 109) scale(0.62)" fill="#FFFFFF">
    <path d="M539 459l-162 -199l-14 -19l1 -10l5 -7l130 -153h-110l-6 2l-4 2l-13 14l-124 142l-4 8v13l2 5l150 185l11 12l12 5z"/>
    <path d="M0 1l158 197l2 1l29 38v8l-5 8l-95 115l-69 86l-2 1l-14 19l5 -1h131l4 -1l7 -3l8 -7l105 -132v-7l-2 -4l-2 -1l-6 -9l-33 -40l-5 -10l-2 -9v-9l3 -12l7 -12l49 -59l5 -7v-5l-15 -21l-69 -86l-22 -27l-8 -7l-13 -5h-143l-1 1l-5 -1z"/>
  </g>
</svg>
