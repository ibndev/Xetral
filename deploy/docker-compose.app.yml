# The APPLICATION node. The only machine with a public address, and Cloudflare
# sits in front of it.
services:
  # The request-serving instance. Scale this one.
  #
  # Every sweep interval is BLANKED here, which is what makes "exactly one
  # instance runs the workers" a fact about the topology rather than a comment
  # in a .env file. `env_file` gives every replica the same variables, so
  # scaling the API to three used to mean three processes asking Bitnob about
  # the same purchase. A blank value disables a sweep (`optionalInteger`
  # treats it as unset), so this can be scaled freely.
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: always
    env_file: .env
    environment:
      RECONCILE_INTERVAL_SECONDS: ''
      DEPOSIT_RECONCILE_INTERVAL_SECONDS: ''
      CRYPTO_RECONCILE_INTERVAL_SECONDS: ''
      CRYPTO_DEPOSIT_RECONCILE_INTERVAL_SECONDS: ''
      GIFTCARD_RELEASE_INTERVAL_SECONDS: ''
      NOTIFICATION_INTERVAL_SECONDS: ''
      ERROR_ALERT_INTERVAL_SECONDS: ''
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # A guarded route answering 401 proves the global guard is mounted, not
      # merely compiled. Three failures in this app were invisible to both the
      # compiler and the tests and appeared only at startup.
      test:
        - CMD-SHELL
        - >-
          wget -qS -O /dev/null http://127.0.0.1:3000/v1/auth/session 2>&1
          | grep -q "401"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # THE WORKER. One replica, never more.
  #
  # The same image as the API — the sweeps start from the application's own
  # bootstrap — but it takes the intervals from .env and is not published to
  # Cloudflare, so nothing routes traffic to it. It still answers on 3000 for
  # its own healthcheck.
  #
  # If this container is not running, no reconciliation happens: a lost
  # webhook is never found, a held purchase is never resolved, and an approved
  # gift card is never released. Its healthcheck is the same guarded-route
  # probe the API uses, so a wedged worker restarts rather than going quiet.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: always
    env_file: .env
    deploy:
      replicas: 1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qS -O /dev/null http://127.0.0.1:3000/v1/auth/session 2>&1
          | grep -q "401"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: always
    env_file: .env
    environment:
      # Server-side only. The browser never learns the API's address.
      XETRAL_API_URL: http://api:3000
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    restart: always
    # Persistence on, because the rate limiter's windows are the only thing
    # standing between a stolen password list and every account on the
    # platform. Losing them on a restart resets every attacker's budget.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redisdata:
