# The DATABASE node. No public address; reachable only on the private network.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    # Bound to the PRIVATE interface only. Binding to 0.0.0.0 here is one
    # firewall mistake away from a customer ledger on the public internet.
    ports:
      - '${PRIVATE_IP}:5432:5432'
    environment:
      POSTGRES_DB: xetral
      POSTGRES_USER: xetral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Explicit rather than inherited: scram-sha-256, never md5.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/primary.conf:/etc/postgresql/primary.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - wal_archive:/var/lib/postgresql/archive
    command: >
      postgres
      -c config_file=/etc/postgresql/primary.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xetral -d xetral']
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 1m

  # Nightly base backups, kept off this machine. Replication protects against
  # a node dying; it does NOT protect against somebody dropping a table, which
  # replicates faithfully to the standby in under a second.
  backup:
    # Built rather than pulled: the stock image has `pg_basebackup` and neither
    # of the two things that turn a local tarball into a backup — something to
    # encrypt with and something to ship with.
    build:
      context: ./standby
      dockerfile: Dockerfile.backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # The PUBLIC half of an age keypair. The private half must never be
      # copied onto this host: encrypting to a public key is what makes a
      # compromise of the database node yield the backups without their
      # contents, and that is the entire point. The container REFUSES TO START
      # without this rather than writing an unencrypted customer ledger.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT}
      # Object storage in a DIFFERENT region. Without it the archives stay on
      # this disk, which protects against a mistaken DELETE and against nothing
      # else — not the disk, not the node, not the provider account.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_REMOTE_TYPE: ${RCLONE_CONFIG_REMOTE_TYPE:-}
      RCLONE_CONFIG_REMOTE_PROVIDER: ${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${RCLONE_CONFIG_REMOTE_REGION:-}
    volumes:
      - backups:/backups

volumes:
  pgdata:
  wal_archive:
  backups:
