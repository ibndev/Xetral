# Xetral — PostgreSQL 16 primary.
#
# Only the settings that are decisions are here. Everything else is left at the
# default deliberately: a config file full of copied numbers is a config file
# nobody can review.

listen_addresses = '*'          # the container's port binding restricts this
max_connections = 200

# ---- Durability -------------------------------------------------------------
# This is a ledger. `synchronous_commit = off` would make writes faster and
# would mean a crash can lose committed journal entries — postings that the
# application told a customer had happened.
synchronous_commit = on
fsync = on
full_page_writes = on

# ---- Replication ------------------------------------------------------------
wal_level = replica
max_wal_senders = 8
max_replication_slots = 8
# Keep enough WAL that a standby which falls behind can catch up rather than
# needing a full rebuild.
wal_keep_size = 2GB

# Archive for point-in-time recovery. Replication covers a dead node; PITR
# covers a bad migration or a mistaken DELETE, which replicates perfectly.
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'

# ---- Memory -----------------------------------------------------------------
# Tuned for a dedicated 8GB database node. On a shared box these numbers are
# wrong, which is part of why the box is not shared.
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB

# ---- Observability ----------------------------------------------------------
# Every statement over a second, with its duration. The ledger's write path is
# short; anything slow is worth seeing.
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
# Never log parameter values on error: bodies here carry PINs and card codes.
log_parameter_max_length_on_error = 0

# ---- Timeouts ---------------------------------------------------------------
# A transaction left open holds locks and blocks the balance triggers.
idle_in_transaction_session_timeout = 60s
statement_timeout = 30s
lock_timeout = 10s
