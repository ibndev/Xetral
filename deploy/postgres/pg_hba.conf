# Xetral — who may connect, from where, and how.
#
# scram-sha-256 everywhere and TLS for anything off-box. There is deliberately
# no `trust` line and no `0.0.0.0/0`.

# TYPE   DATABASE      USER         ADDRESS         METHOD

# Local socket, for maintenance on the node itself.
local    all           all                          scram-sha-256

# The application node, over the private network, TLS required.
hostssl  xetral        xetral       10.0.0.0/24     scram-sha-256

# The standby, replicating. A dedicated role with REPLICATION and nothing
# else — a standby that could also read customer rows is a second copy of the
# data with a second set of credentials guarding it.
hostssl  replication   replicator   10.0.0.0/24     scram-sha-256

# Everything else is refused. The default when no line matches is to reject,
# and this line makes that explicit for anyone reading the file.
host     all           all          all             reject
