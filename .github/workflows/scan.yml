# ============================================================================
#  Reading the source for what the tests cannot see.
#
#  THREE THINGS, and they answer different questions.
#
#  CodeQL asks what a well-known bug class looks like in this language, and it
#  is worth running precisely because nobody here wrote its rules.
#
#  The XETRAL RULES ask about the invariants this system actually rests on —
#  only the ledger writes postings, money is never a float, a secret never
#  reaches a log line. No generic ruleset can know those, and until now every
#  one of them was enforced by a person reading a diff. Three of the five
#  caught something real on the day they were written.
#
#  The PROBE asks whether those rules still match anything at all. A rule that
#  matches nothing looks exactly like a rule that finds nothing, and one of
#  these had that fault before it ever ran: its pattern was a folded YAML
#  scalar, so every newline became a space, and the regex matched nothing while
#  reading perfectly correctly.
#
#  SEPARATE FROM ci.yml on purpose. CodeQL takes minutes and this must not sit
#  between a developer and a test result — but the xetral rules are seconds and
#  block, because they are about money.
# ============================================================================
name: Scan

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    # Weekly, because CodeQL's rules change even when this repository does not.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  xetral-rules:
    name: The rules about this codebase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep

      # BEFORE the scan. If a rule matches nothing, a clean scan means nothing
      # either, and running them in the other order would report success twice.
      - name: Every rule still matches what it is about
        run: sh .semgrep/probe/run.sh

      - name: Scan
        run: |
          semgrep --config .semgrep/xetral.yml \
            --metrics=off --error \
            --exclude=node_modules --exclude=dist --exclude=.next \
            --exclude='*.probe' \
            .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-and-quality` over `security-extended`: the quality rules
          # are what catch an unawaited promise, and in this codebase a
          # forgotten `await` on a ledger write is a money bug rather than a
          # style one.
          queries: security-and-quality

      # No build step. The repository is TypeScript that is bundled rather than
      # compiled to an artifact CodeQL needs, and its extractor reads the
      # sources directly.
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  generic-rules:
    name: Semgrep's own rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep

      # REPORTS, does not block, and that is the same argument the dependency
      # audit makes: a generic ruleset over a repository this size produces
      # findings in test fixtures and build tooling, and failing the build on
      # those trains everybody to skip the step — after which the one finding
      # that IS in the request path scrolls past with the rest.
      #
      # It is read, not ignored: the findings land in the job summary, and the
      # day one of them belongs in `.semgrep/xetral.yml` it gets written there
      # as a rule that DOES block.
      # NOT VERIFIED LOCALLY, and worth saying. The development container here
      # cannot reach `semgrep.dev` — the egress policy answers 403 at CONNECT,
      # the same reason the Bitnob sandbox probe runs on a runner — so the
      # registry rulesets are fetched for the first time on the runner. That is
      # also why this job cannot fail the build: an unreachable registry would
      # otherwise be a red build about nothing.
      - name: Scan and report
        run: |
          semgrep --config p/typescript --config p/nodejs --config p/owasp-top-ten \
            --metrics=off \
            --exclude=node_modules --exclude=dist --exclude=.next \
            --exclude='*.probe' --exclude='*.test.ts' \
            . > /tmp/semgrep.txt 2>&1 || true
          tail -40 /tmp/semgrep.txt
          {
            echo '### Semgrep, generic rulesets'
            echo
            echo 'Advisory. Blocking rules live in `.semgrep/xetral.yml`.'
            echo
            echo '```'
            tail -40 /tmp/semgrep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dynamic:
    name: Scan the running app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ------------------------------------------------------------------
    # The half static analysis cannot see.
    #
    # `ci.yml` already boots both bundles and ASSERTS specific things about
    # them — that every controller is mounted, that a guarded route answers
    # 401, that every script carries the CSP nonce, that the headers are
    # there. Those are the checks worth blocking on, because each one names a
    # failure this application has actually had.
    #
    # This is the other question: what does a scanner find that nobody thought
    # to assert? It REPORTS rather than blocks, for the same reason the generic
    # Semgrep packs do — a baseline scan over an app this size finds things
    # about a sign-in page that are true of every sign-in page, and failing on
    # those teaches everybody to skip the step. When a finding here matters it
    # becomes a `check` in ci.yml, where it does block.
    # ------------------------------------------------------------------
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xetral
          POSTGRES_PASSWORD: xetral
          POSTGRES_DB: xetral
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: xetral
      DATABASE_URL: postgres://xetral:xetral@localhost:5432/xetral

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Start the API
        run: |
          ACCESS_TOKEN_KEYS="v1:$(openssl rand -base64 32)" \
          ACCESS_TOKEN_CURRENT_VERSION=v1 \
          XETRAL_ENVIRONMENT=production \
          PORT=3100 \
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null "http://127.0.0.1:3100/health" && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3100/health

      # The schema is deliberately NOT applied. A scanner sending thousands of
      # requests at a database it can write to is a scanner that seeds
      # thousands of accounts, and none of the findings worth having here need
      # one — they are about headers, methods, and what an unauthenticated
      # caller can reach.
      - name: Baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:3100'
          # Passive only. An ACTIVE scan against a money API sends requests
          # designed to change state, and this one is wired to a real ledger
          # schema in every environment where it would be worth running.
          cmd_options: '-a -I -j'
          # The findings are the output. A red X here would be a red X on
          # every push about a sign-in page behaving like a sign-in page.
          fail_action: false
          allow_issue_writing: false
