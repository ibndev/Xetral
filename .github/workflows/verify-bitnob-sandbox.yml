# ============================================================================
#  Ask Bitnob's sandbox what is actually true.
#
#  WHY IN CI. Every constant in the Bitnob adapters is verified against their
#  own Node SDK, which is the best evidence available without a live call — but
#  the SDK defines no webhook event names and says nothing about response
#  shapes, and both have already been wrong once. A stub cannot catch that;
#  only the provider can. Development containers here cannot reach
#  `sandboxapi.bitnob.co` at all (the egress policy answers 403 at CONNECT), so
#  the call is made from a runner that can.
#
#  MANUAL ONLY. This authenticates to a provider. It should happen when
#  somebody wants an answer, not on every push.
#
#  THE CREDENTIAL IS A REPOSITORY SECRET and never appears in the workflow, the
#  script, the logs or the report. Add it under
#  Settings → Secrets and variables → Actions as BITNOB_SANDBOX_API_KEY.
# ============================================================================
name: Verify Bitnob sandbox

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refuse to run without sandbox credentials
        # Named rather than left to fail inside the script, so the reason is the
        # first thing in the log rather than a stack trace.
        #
        # Through `env:`, never through `${{ }}` in the run block. An
        # expression is pasted in as TEXT before bash sees it, and the repo
        # rule about that has no exception for secrets — a value that reaches
        # a shell as text is a value that can be a command.
        env:
          CLIENT_ID: ${{ secrets.BITNOB_SANDBOX_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BITNOB_SANDBOX_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::BITNOB_SANDBOX_CLIENT_ID and BITNOB_SANDBOX_CLIENT_SECRET must both be set."
            echo "::error::Bitnob v2 SIGNS each request, so the old single API key cannot be used."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Probe the sandbox
        env:
          # ONE HOST for sandbox and production alike — v2 has no separate
          # sandbox address. What keeps this off production is the script's
          # first probe: it asks `/api/whoami` and aborts unless the answer is
          # `sandbox`, which asks the provider rather than pattern-matching a
          # URL somebody typed.
          BITNOB_BASE_URL: https://api.bitnob.com
          BITNOB_CLIENT_ID: ${{ secrets.BITNOB_SANDBOX_CLIENT_ID }}
          BITNOB_CLIENT_SECRET: ${{ secrets.BITNOB_SANDBOX_CLIENT_SECRET }}
        run: node scripts/verify-bitnob-sandbox.mjs

      - name: Summarise what the provider said
        if: always()
        run: |
          if [ ! -f bitnob-sandbox-report.json ]; then
            echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          {
            echo "### Bitnob sandbox"
            echo ""
            echo "Keys only — no values and no credential are recorded."
            echo ""
            echo '```json'
            cat bitnob-sandbox-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitnob-sandbox-report
          path: bitnob-sandbox-report.json
          if-no-files-found: warn
          retention-days: 14
