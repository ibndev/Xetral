# ============================================================================
#  Build an installable Android APK.
#
#  WHY THIS RUNS IN CI RATHER THAN ANYWHERE ELSE. Building an Android app needs
#  the Android SDK, and the SDK is only distributed from `dl.google.com`. A
#  GitHub runner has it preinstalled; a sandboxed development container often
#  cannot reach that host at all. So the APK is built where the toolchain
#  already lives, and comes back as an artifact anybody can download from the
#  run's summary page.
#
#  MANUAL ONLY, on purpose. This is a ten-minute job producing a file for a
#  human to install on a phone, so it runs when somebody asks for it rather
#  than on every push.
#
#  THE API ADDRESS IS AN INPUT, and that is the part that makes the build
#  useful rather than decorative. `EXPO_PUBLIC_API_URL` is INLINED INTO THE
#  BUNDLE at build time — the phone cannot be told later where the API lives,
#  so an APK built against the wrong address is an APK that can do nothing but
#  show a sign-in screen that never answers.
# ============================================================================
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: >-
          Where the phone should reach the API. Must be an address the PHONE can
          resolve — a laptop's address on the same Wi-Fi (http://192.168.x.x:3100),
          a tunnel, or a deployed host. "localhost" is the phone itself and will
          never work.
        required: true
        type: string
      variant:
        description: >-
          release bundles the JavaScript into the APK and runs on its own.
          debug expects a Metro server on your machine — only useful if the
          phone is plugged into a laptop that is running one.
        required: true
        default: release
        type: choice
        options: [release, debug]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Refuse an address the phone cannot reach
        # Checked BEFORE forty minutes of Gradle rather than discovered after
        # installing the result. localhost inside an APK is the handset itself,
        # so the app would start perfectly and never reach anything — which
        # looks like a broken app rather than a wrong build input.
        run: |
          url='${{ inputs.api_url }}'
          case "$url" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "::error::$url points at the phone itself. Use the address the"
              echo "::error::phone can reach your machine on, e.g. http://192.168.1.20:3100"
              exit 1 ;;
            http://*|https://*) echo "building against $url" ;;
            *) echo "::error::api_url must start with http:// or https://"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up the JDK React Native 0.76 expects
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, not the newest. React Native's Gradle plugin is pinned to it,
          # and a newer JDK fails deep inside a Kotlin compile with an error
          # that says nothing about the version.
          java-version: 17

      - run: npm ci

      # The client package is TypeScript source rather than a build artifact,
      # so a break there is a break in the app. Caught here in seconds instead
      # of forty minutes later inside Metro's bundler.
      - name: Typecheck the app and the client it uses
        run: |
          npm run typecheck --workspace @xetral/client
          npm run typecheck --workspace @xetral/mobile

      - name: Generate the native project from app.json
        # --clean, so a stale android/ from a previous run can never contribute
        # to this one. app.json is the source of truth; this is its output.
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile

      - name: Build the APK
        # EXPO_PUBLIC_API_URL is read by apps/mobile/src/session.ts and inlined
        # into the bundle here. It is not a secret and must not be: anything in
        # an EXPO_PUBLIC_ variable ships to the device and can be read back out
        # of the APK.
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          if [ '${{ inputs.variant }}' = 'debug' ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Name the file after what is in it
        id: apk
        run: |
          src=$(find apps/mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$src" ]; then echo "::error::gradle produced no APK"; exit 1; fi
          name="xetral-${{ inputs.variant }}-${GITHUB_SHA::7}.apk"
          cp "$src" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | \`$name\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(du -h "$name" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Talks to | \`${{ inputs.api_url }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from **Artifacts** below, then open it on the phone." >> "$GITHUB_STEP_SUMMARY"
          echo "Android will ask you to allow installing from your browser or files app." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          # Long enough to reinstall after a weekend, short enough that build
          # outputs are not kept for ever.
          retention-days: 30
          if-no-files-found: error
