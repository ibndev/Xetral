# ============================================================================
#  Build an installable Android APK — a DEVELOPMENT BUILD, or a standalone one.
#
#  WHY THIS RUNS IN CI RATHER THAN ANYWHERE ELSE. Building an Android app needs
#  the Android SDK, and the SDK is only distributed from `dl.google.com`. A
#  GitHub runner has it preinstalled; a sandboxed development container often
#  cannot reach that host at all. So the APK is built where the toolchain
#  already lives.
#
#  WHAT REPLACED EXPO GO, and why it had to. Expo Go ships ONE SDK version at a
#  time, so a project built for anything else simply refuses to open — and it
#  contains only the native modules Expo chose, so it can never run an app with
#  its own. A DEVELOPMENT BUILD is this app's own binary with `expo-dev-client`
#  in it: same iteration loop, same Metro server, same fast refresh, but the
#  native side is ours and the SDK version is whatever this repository says.
#
#  THE TWO VARIANTS ANSWER DIFFERENT QUESTIONS, and the difference is where the
#  JavaScript comes from:
#
#    development  loads JS from a Metro server you run.       Needs a laptop on
#                 The dev launcher asks for its address, so   the same network.
#                 the phone need not be plugged into
#                 anything. THIS IS THE EXPO GO REPLACEMENT.
#
#    preview      has the JS bundled inside it.               Needs nothing.
#                 Install it and it runs. This is what you    Talks to whatever
#                 hand to somebody who is not a developer.    `api_url` says.
#
#  `EXPO_PUBLIC_API_URL` IS INLINED WHEN THE JAVASCRIPT IS BUNDLED, which is
#  the reason `api_url` is required for one variant and ignored by the other. A
#  preview APK is bundled HERE, so the address is baked in and the phone cannot
#  be told later. A development build is bundled by Metro ON YOUR MACHINE every
#  time you press save, so the address comes from the environment you start
#  Metro with — and a value passed here would be silently ignored, which is
#  worse than refusing it.
# ============================================================================
name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: >-
          development: your own Expo Go replacement — loads JS from Metro on
          your machine. preview: standalone, JS bundled in, runs on its own.
        required: true
        default: development
        type: choice
        options: [development, preview]
      api_url:
        description: >-
          PREVIEW ONLY, and required for it. Where the phone should reach the
          API — a deployed host, or your machine's address on the same Wi-Fi
          (http://192.168.x.x:3100). "localhost" is the phone itself and will
          never work. Ignored for a development build, which takes the address
          from the shell you run `npx expo start` in.
        required: false
        type: string
      publish_release:
        description: >-
          Attach the APK to a GitHub prerelease so it can be downloaded
          directly on the phone. Off means artifact only — a .zip, which a
          phone has to unpack before it can install anything.
        required: true
        default: true
        type: boolean

# Needed to create the release the phone downloads from.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Refuse an address the phone cannot reach
        # EVERY INPUT REACHES THE SHELL THROUGH `env`, NEVER THROUGH `${{ }}`.
        # An expression interpolated into a `run:` block is pasted in as TEXT
        # before bash sees it, so a value containing a quote and a semicolon
        # is a command — and this job holds a token with `contents: write`.
        # CodeQL flagged exactly that on the first version of this file, and it
        # was right: `workflow_dispatch` narrows who can supply the value, it
        # does not make the value safe. As an environment variable it is data.
        #
        # Checked BEFORE forty minutes of Gradle rather than discovered after
        # installing the result. `localhost` inside an APK is the handset
        # itself, so the app would start perfectly and reach nothing — which
        # looks like a broken app rather than a wrong build input.
        env:
          VARIANT: ${{ inputs.variant }}
          API_URL: ${{ inputs.api_url }}
        run: |
          variant="$VARIANT"
          url="$API_URL"

          if [ "$variant" = 'development' ]; then
            if [ -n "$url" ]; then
              # Refused rather than ignored. Accepting it would hand somebody a
              # build they believe is pointed at an address it knows nothing
              # about, and the first symptom would be a sign-in that fails
              # against the wrong host.
              echo "::error::api_url does not apply to a development build."
              echo "::error::Metro bundles the JavaScript on your machine, so the"
              echo "::error::address comes from there:"
              echo "::error::  EXPO_PUBLIC_API_URL=http://192.168.1.20:3100 npx expo start"
              exit 1
            fi
            echo "development build: the address is whatever Metro is started with"
            exit 0
          fi

          if [ -z "$url" ]; then
            echo "::error::a preview APK has the address bundled into it, so api_url is required"
            exit 1
          fi
          # Nothing but the characters a URL is made of. As an environment
          # variable a quote is already inert, so this is not the injection
          # defence — that is `env:` above. It is this step doing its stated
          # job: an address with a space or a semicolon in it cannot work, and
          # saying so now is better than baking it into a bundle.
          case "$url" in
            *[!A-Za-z0-9:/._~%?=@+-]*)
              echo "::error::api_url contains a character no URL should:"
              echo "::error::  $url"
              exit 1 ;;
          esac

          case "$url" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "::error::$url points at the phone itself. Use the address the"
              echo "::error::phone can reach your machine on, e.g. http://192.168.1.20:3100"
              exit 1 ;;
            http://*|https://*) echo "preview build against $url" ;;
            *) echo "::error::api_url must start with http:// or https://"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up the JDK this React Native expects
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, not the newest. React Native's Gradle plugin and AGP are pinned
          # to it, and a newer JDK fails deep inside a Kotlin compile with an
          # error that says nothing about the version.
          java-version: 17

      - run: npm ci

      # The client package is TypeScript source rather than a build artifact,
      # so a break there is a break in the app. Caught here in seconds instead
      # of forty minutes later inside Metro's bundler.
      - name: Typecheck the app and the client it uses
        run: |
          npm run typecheck --workspace @xetral/client
          npm run typecheck --workspace @xetral/mobile

      - name: Generate the native project from app.json
        # --clean, so a stale android/ from a previous run can never contribute
        # to this one. app.json is the source of truth; this is its output.
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile

      - name: The APK asks for nothing it does not use
        # Expo's android template ships SYSTEM_ALERT_WINDOW, READ_EXTERNAL_
        # STORAGE and WRITE_EXTERNAL_STORAGE in the main manifest, and every
        # APK this repository built carried all three. None is used by any
        # code here — and "display over other apps" on a banking app is a
        # permission a customer can see and reasonably refuse to install over.
        #
        # `android.blockedPermissions` in app.json removes them. Asserted
        # rather than trusted, because it is one key in a config file whose
        # effect is three lines deep in generated XML nobody reads.
        run: |
          manifest=apps/mobile/android/app/src/main/AndroidManifest.xml
          fail=0
          for perm in SYSTEM_ALERT_WINDOW READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE; do
            line=$(grep "permission.$perm" "$manifest" || true)
            if [ -z "$line" ]; then
              echo "ok: $perm is absent"
            elif echo "$line" | grep -q 'tools:node="remove"'; then
              echo "ok: $perm is marked for removal"
            else
              echo "::error::$perm would ship in this APK and nothing uses it"
              fail=1
            fi
          done
          # The other direction: what the app genuinely needs must survive.
          # A blockedPermissions entry with a typo would otherwise take out
          # biometrics and present as "Face ID does not work on Android".
          for perm in INTERNET USE_BIOMETRIC; do
            if grep "permission.$perm" "$manifest" | grep -q 'tools:node="remove"'; then
              echo "::error::$perm is blocked, and the app needs it"
              fail=1
            elif grep -q "permission.$perm" "$manifest"; then
              echo "ok: $perm is requested"
            else
              echo "::error::$perm is missing from the manifest"
              fail=1
            fi
          done
          exit $fail

      - name: Build the APK
        # EXPO_PUBLIC_API_URL is read by apps/mobile/src/session.ts. It is not
        # a secret and must not be: anything in an EXPO_PUBLIC_ variable ships
        # to the device and can be read straight back out of the APK.
        #
        # Unset for a development build, deliberately — nothing bundles the
        # JavaScript here, so a value would go nowhere and reading one in the
        # log would suggest otherwise.
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.variant == 'preview' && inputs.api_url || '' }}
          VARIANT: ${{ inputs.variant }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          if [ "$VARIANT" = 'development' ]; then
            # assembleDebug, which is what makes it a development build: the
            # dev launcher from expo-dev-client is only in the debug variant.
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Name the file after what is in it
        id: apk
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          src=$(find apps/mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$src" ]; then echo "::error::gradle produced no APK"; exit 1; fi
          name="xetral-${VARIANT}-${GITHUB_SHA::7}.apk"
          cp "$src" "$name"
          {
            echo "name=$name"
            echo "tag=apk-${VARIANT}-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Write the notes the release page shows
        if: ${{ inputs.publish_release }}
        env:
          VARIANT: ${{ inputs.variant }}
          API_URL: ${{ inputs.api_url }}
        # Built in a FILE rather than inline. The first version nested a
        # heredoc inside a command substitution inside a double-quoted
        # argument, and its closing delimiter was indented — which does not
        # terminate an unquoted heredoc, so the step would have hung rather
        # than failed. Shell quoting is not the place to be clever.
        run: |
          if [ "$VARIANT" = 'development' ]; then
            cat > /tmp/notes.md <<'EOF'
          Loads its JavaScript from a Metro server **you** run, so it replaces
          Expo Go rather than the deployed app. On the machine with the repo:

          ```
          EXPO_PUBLIC_API_URL=http://<your-lan-ip>:3100 npm start --workspace @xetral/mobile
          ```

          Then open Xetral on the phone and give the launcher that address.
          Phone and laptop must be on the same network. Fast refresh works;
          shake the phone for the dev menu.
          EOF
          else
            cat > /tmp/notes.md <<EOF
          Standalone: the JavaScript is inside it, and it talks to
          \`${API_URL}\`. Nothing else needs to be running.
          EOF
          fi
          cat >> /tmp/notes.md <<EOF

          Built from \`${GITHUB_SHA::7}\`.

          Signed with the standard Android **debug** key, so Play Protect will
          warn once on install and this must never be distributed. Both
          variants share one application id, so installing either replaces the
          other.
          EOF

      - name: Publish it where a phone can reach it
        if: ${{ inputs.publish_release }}
        # A RELEASE ASSET, NOT AN ARTIFACT, and that is the whole point of this
        # step. An Actions artifact is a ZIP behind a login: on a phone that
        # means signing in to GitHub in a mobile browser, downloading an
        # archive, finding something that will unpack it, and only then
        # installing. A release asset is the .apk itself, one tap.
        #
        # A PRERELEASE, so a build never becomes "the latest release" of a
        # platform that has not shipped.
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_TAG: ${{ steps.apk.outputs.tag }}
        run: |
          tag="$APK_TAG"
          # Deleted first, so re-running for the same commit replaces the file
          # rather than failing on a tag that already exists.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Xetral $VARIANT build ${GITHUB_SHA::7}" \
            --notes-file /tmp/notes.md
          url=$(gh release view "$tag" --json url --jq .url)
          {
            echo "### APK published"
            echo
            echo "**[Open the release page]($url)** on the phone and tap"
            echo "\`$APK_NAME\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Always, release or not. The artifact is the audit trail and the
      # fallback for anybody who would rather not create a release.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          # Long enough to reinstall after a weekend, short enough that build
          # outputs are not kept for ever.
          retention-days: 30
          if-no-files-found: error

      - name: Say what was built and what to do with it
        env:
          VARIANT: ${{ inputs.variant }}
          API_URL: ${{ inputs.api_url }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          if [ "$VARIANT" = 'preview' ]; then talks="\`$API_URL\`"
          else talks='whatever Metro is started with'; fi
          {
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$APK_NAME\` |"
            echo "| Size | $(du -h "$APK_NAME" | cut -f1) |"
            echo "| Variant | \`$VARIANT\` |"
            echo "| Talks to | $talks |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
